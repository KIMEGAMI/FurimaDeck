name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '24'
  APP_ENV: testing
  DB_CONNECTION: sqlite
  DB_DATABASE: ':memory:'
  CACHE_STORE: array
  SESSION_DRIVER: array
  QUEUE_CONNECTION: sync
  MAIL_MAILER: array

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Verify immutable workflow dependencies
        run: |
          node scripts/check-github-actions-pinned.mjs
          node --test scripts/check-github-actions-pinned.test.mjs

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, ctype, curl, dom, exif, fileinfo, gd, mbstring, openssl, pdo_mysql, pdo_sqlite, sqlite3, tokenizer, xml, zip
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --ansi

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Test E2E runtime safety
        run: npm run test:e2e-runtime

      - name: Prepare application key
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Compile Blade views
        run: php artisan view:cache

      - name: Validate FurimaDeck routes
        run: php artisan route:list --path=furimadeck

      - name: Configure ephemeral E2E demo user
        run: |
          demo_password="$(openssl rand -hex 24)"
          echo "::add-mask::${demo_password}"
          {
            echo "APP_URL=http://127.0.0.1:8002"
            echo "SESSION_DRIVER=file"
            echo "CACHE_STORE=file"
            echo "FURIMADECK_CUTOVER_ENABLED=true"
            echo "FURIMADECK_PRODUCT_MANAGEMENT_ENABLED=true"
            echo "FURIMADECK_DEMO_USER_ENABLED=true"
            echo "FURIMADECK_DEMO_USER_EMAIL=demo@example.com"
            echo "FURIMADECK_DEMO_USER_PASSWORD=${demo_password}"
          } >> "$GITHUB_ENV"
          {
            echo "APP_URL=http://127.0.0.1:8002"
            echo "SESSION_DRIVER=file"
            echo "CACHE_STORE=file"
            echo "FURIMADECK_CUTOVER_ENABLED=true"
            echo "FURIMADECK_PRODUCT_MANAGEMENT_ENABLED=true"
            echo "FURIMADECK_DEMO_USER_ENABLED=true"
            echo "FURIMADECK_DEMO_USER_EMAIL=demo@example.com"
            echo "FURIMADECK_DEMO_USER_PASSWORD=${demo_password}"
          } >> .env

      - name: Build frontend assets
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E tests
        env:
          APP_URL: http://127.0.0.1:8002
          DB_CONNECTION: furimadeck
          SESSION_DRIVER: file
          CACHE_STORE: file
          FURIMADECK_CUTOVER_ENABLED: true
          FURIMADECK_PRODUCT_MANAGEMENT_ENABLED: true
          FURIMADECK_DB_DRIVER: sqlite
          FURIMADECK_DB_DATABASE: ${{ github.workspace }}/storage/framework/testing/furimadeck-e2e.sqlite
        run: npm run test:e2e

      - name: Check PHP code style
        run: vendor/bin/pint --test

      - name: Run PHP tests
        env:
          CACHE_STORE: array
          SESSION_DRIVER: array
          FURIMADECK_R2_LIVE_TEST: '0'
          FURIMADECK_R2_PRODUCTION_LIVE_TEST: '0'
        run: |
          php artisan config:clear --ansi
          vendor/bin/phpunit --list-groups
          vendor/bin/phpunit --no-coverage --fail-on-all-issues --display-all-issues --exclude-group=live-r2 --exclude-group=mariadb-gate

      - name: Audit PHP dependencies
        run: composer audit --locked --no-interaction

      - name: Audit Node dependencies
        run: npm audit --audit-level=high
  mariadb-gate:
    name: MariaDB CSV gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb@sha256:d1891ede5a559f1086f55053bb8cc1569b0298338c4d72d71725a7f74f6ba620
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
          MARIADB_DATABASE: furimadeck_csv_gate
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, ctype, curl, dom, exif, fileinfo, gd, mbstring, openssl, pdo_mysql, pdo_sqlite, sqlite3, tokenizer, xml, zip
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --ansi

      - name: Prepare application key
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Migrate isolated MariaDB database
        env:
          FURIMADECK_DB_DRIVER: mysql
          FURIMADECK_DB_HOST: 127.0.0.1
          FURIMADECK_DB_PORT: 3306
          FURIMADECK_DB_DATABASE: furimadeck_csv_gate
          FURIMADECK_DB_USERNAME: root
          FURIMADECK_DB_PASSWORD: ""
        run: php artisan migrate --database=furimadeck --path=database/migrations/furimadeck --force

      - name: Run MariaDB CSV gate
        env:
          FURIMADECK_MARIADB_GATE: '1'
          FURIMADECK_DB_DRIVER: mysql
          FURIMADECK_DB_HOST: 127.0.0.1
          FURIMADECK_DB_PORT: 3306
          FURIMADECK_DB_DATABASE: furimadeck_csv_gate
          FURIMADECK_DB_USERNAME: root
          FURIMADECK_DB_PASSWORD: ""
        run: vendor/bin/phpunit --no-coverage tests/Feature/FurimaDeckMariaDbCsvGateTest.php
