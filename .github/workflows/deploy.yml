name: Legacy CD (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  DEPLOY_PATH: /var/www/furugi
  DEPLOY_PORT: '22'
  MIN_PHP_VERSION: 8.4.1

jobs:
  deploy:
    if: ${{ false }}
    name: Legacy deploy disabled
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_SSH_KNOWN_HOSTS"

      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || env.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || env.DEPLOY_PORT }}
          MIN_PHP_VERSION: ${{ env.MIN_PHP_VERSION }}
        run: |
          printf -v DEPLOY_PATH_ARG '%q' "$DEPLOY_PATH"
          printf -v MIN_PHP_VERSION_ARG '%q' "$MIN_PHP_VERSION"
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- $DEPLOY_PATH_ARG $MIN_PHP_VERSION_ARG" <<'SCRIPT'
          set -euo pipefail

          DEPLOY_PATH="$1"
          MIN_PHP_VERSION="$2"
          cd "$DEPLOY_PATH"
          for writable_path in "$DEPLOY_PATH/.git" "$DEPLOY_PATH/node_modules" "$DEPLOY_PATH/public/build"; do
            if [ -e "$writable_path" ]; then
              sudo chown -R www-data:www-data "$writable_path"
            fi
          done
          php -r "if (version_compare(PHP_VERSION, '$MIN_PHP_VERSION', '<')) { fwrite(STDERR, 'PHP $MIN_PHP_VERSION or newer is required. Current: '.PHP_VERSION.PHP_EOL); exit(1); }"
          sudo -u www-data git -c safe.directory="$DEPLOY_PATH" pull origin main
          sudo -u www-data composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress
          sudo -u www-data npm ci --ignore-scripts
          sudo -u www-data npm run build
          php artisan migrate --force
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan queue:restart || true
          sudo systemctl reload apache2
          SCRIPT
