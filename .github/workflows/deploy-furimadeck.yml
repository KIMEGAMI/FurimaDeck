name: Deploy FurimaDeck

on:
  workflow_dispatch:
    inputs:
      production_backup_reference:
        description: Verified production database backup reference. Do not include credentials.
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: furimadeck-production-deploy
  cancel-in-progress: false

env:
  FURIMADECK_DEPLOY_PORT: '22'
  MIN_PHP_VERSION: '8.4.1'

jobs:
  quality-gate:
    name: Verify CI and Security for this commit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read

    steps:
      - name: Require verified production backup reference
        env:
          BACKUP_REFERENCE: ${{ inputs.production_backup_reference }}
        run: |
          set -euo pipefail
          if [[ -z "$BACKUP_REFERENCE" ]]; then
            echo "A verified production backup reference is required." >&2
            exit 1
          fi
          echo "Required production backup reference is present."

      - name: Require successful push checks for the exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          runs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${DEPLOY_SHA}&per_page=100")"

          for workflow_name in CI Security; do
            state="$(jq -r --arg workflow_name "$workflow_name" --arg deploy_sha "$DEPLOY_SHA" '
              [.workflow_runs[]
                | select(.name == $workflow_name
                    and .head_sha == $deploy_sha
                    and .head_branch == "main"
                    and .event == "push")]
              | sort_by(.run_number, .run_attempt, .created_at)
              | last
              | if . == null then "missing"
                elif .status != "completed" then .status
                else .conclusion
                end
            ' <<< "$runs_json")"

            if [[ "$state" != "success" ]]; then
              echo "$workflow_name has no successful completed push run for $DEPLOY_SHA (state: $state)." >&2
              exit 1
            fi
          done

  deploy:
    name: Manually deploy FurimaDeck production
    needs: quality-gate
    if: github.ref == 'refs/heads/main' && needs.quality-gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Check out reviewed main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate FurimaDeck deployment settings
        env:
          DEPLOY_HOST: ${{ secrets.FURIMADECK_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.FURIMADECK_DEPLOY_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.FURIMADECK_DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.FURIMADECK_DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.FURIMADECK_DEPLOY_PATH }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_SSH_KNOWN_HOSTS"
          test "$DEPLOY_PATH" = "/var/www/furimadeck"

      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.FURIMADECK_DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.FURIMADECK_DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.FURIMADECK_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.FURIMADECK_DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.FURIMADECK_DEPLOY_PATH }}
          DEPLOY_PORT: ${{ vars.FURIMADECK_DEPLOY_PORT || env.FURIMADECK_DEPLOY_PORT }}
          DEPLOY_SHA: ${{ github.sha }}
          MIN_PHP_VERSION: ${{ env.MIN_PHP_VERSION }}
        run: |
          printf -v DEPLOY_PATH_ARG '%q' "$DEPLOY_PATH"
          printf -v DEPLOY_SHA_ARG '%q' "$DEPLOY_SHA"
          printf -v MIN_PHP_VERSION_ARG '%q' "$MIN_PHP_VERSION"
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- $DEPLOY_PATH_ARG $DEPLOY_SHA_ARG $MIN_PHP_VERSION_ARG" <<'SCRIPT'
          set -euo pipefail

          DEPLOY_PATH="$1"
          DEPLOY_SHA="$2"
          MIN_PHP_VERSION="$3"
          if [[ "$DEPLOY_PATH" != "/var/www/furimadeck" ]]; then
            echo "Refusing to deploy FurimaDeck outside /var/www/furimadeck." >&2
            exit 1
          fi

          test -d "$DEPLOY_PATH"
          test -f "$DEPLOY_PATH/.env"
          test ! -e "$DEPLOY_PATH/public/hot"
          cd "$DEPLOY_PATH"
          test "$(git branch --show-current)" = "main"
          git status --porcelain
          test -z "$(git status --porcelain)"
          for unit in furimadeck-queue.service furimadeck-scheduler.timer apache2; do
            if ! systemctl is-enabled --quiet "$unit" || ! systemctl is-active --quiet "$unit"; then
              echo "Required production service is not enabled and active: $unit" >&2
              exit 1
            fi
          done
          if [[ ! -x /usr/bin/php ]]; then
            echo "The PHP binary used by the systemd queue worker is missing: /usr/bin/php" >&2
            exit 1
          fi
          PHP_BIN="$(command -v php)"
          SYSTEMD_PHP_BIN="$(readlink -f /usr/bin/php)"
          DEPLOY_PHP_REALPATH="$(readlink -f "$PHP_BIN")"
          if [[ -z "$SYSTEMD_PHP_BIN" || "$SYSTEMD_PHP_BIN" != "$DEPLOY_PHP_REALPATH" ]]; then
            echo "The deployment PHP binary differs from the systemd queue worker PHP binary." >&2
            exit 1
          fi
          "$PHP_BIN" -r "if (version_compare(PHP_VERSION, '$MIN_PHP_VERSION', '<')) { fwrite(STDERR, 'PHP $MIN_PHP_VERSION or newer is required. Current: '.PHP_VERSION.PHP_EOL); exit(1); }"
          git fetch origin main
          REMOTE_MAIN_SHA="$(git rev-parse origin/main)"
          if [[ "$REMOTE_MAIN_SHA" != "$DEPLOY_SHA" ]]; then
            echo "main advanced after this deployment was dispatched; rerun after checking the new commit." >&2
            exit 1
          fi
          git merge --ff-only "$DEPLOY_SHA"
          for writable_path in "$DEPLOY_PATH/vendor" "$DEPLOY_PATH/node_modules" "$DEPLOY_PATH/public/build"; do
            if [[ -L "$writable_path" ]]; then
              echo "Refusing to change ownership of a symlinked build directory: $writable_path" >&2
              exit 1
            fi
            if [[ -e "$writable_path" ]]; then
              sudo chown -R www-data:www-data "$writable_path"
            fi
          done
          COMPOSER_BIN="$(command -v composer)"
          NPM_BIN="$(command -v npm)"
          test -x "$COMPOSER_BIN"
          test -x "$NPM_BIN"
          test -x "$PHP_BIN"
          sudo -u www-data "$COMPOSER_BIN" install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress
          sudo -u www-data "$NPM_BIN" ci --ignore-scripts
          sudo -u www-data "$NPM_BIN" run build
          sudo -u www-data "$PHP_BIN" artisan optimize:clear
          sudo -u www-data "$PHP_BIN" artisan migrate --database=furimadeck --path=database/migrations/furimadeck --force
          sudo -u www-data "$PHP_BIN" artisan db:seed --database=furimadeck --class=Database\\Seeders\\FurimaDeckCategorySeeder --force
          sudo -u www-data "$PHP_BIN" artisan db:seed --database=furimadeck --class=Database\\Seeders\\FurimaDeckMarketplaceSeeder --force
          sudo -u www-data "$PHP_BIN" artisan furimadeck:check-cutover
          sudo -u www-data "$PHP_BIN" artisan config:cache
          sudo -u www-data "$PHP_BIN" artisan route:cache
          sudo -u www-data "$PHP_BIN" artisan view:cache
          sudo systemctl restart furimadeck-queue.service
          sudo systemctl restart furimadeck-scheduler.timer
          sudo systemctl reload apache2
          sudo systemctl is-active --quiet furimadeck-queue.service
          sudo systemctl is-active --quiet furimadeck-scheduler.timer
          sudo systemctl is-active --quiet apache2
          SCRIPT
