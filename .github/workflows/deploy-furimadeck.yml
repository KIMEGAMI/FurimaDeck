name: Deploy FurimaDeck

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI
      - Security
    types:
      - completed

permissions:
  contents: read
  actions: read

concurrency:
  group: furimadeck-production-deploy
  cancel-in-progress: false

env:
  FURIMADECK_DEPLOY_PORT: '22'
  MIN_PHP_VERSION: '8.4.1'

jobs:
  quality-gate:
    name: Wait for CI and Security
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Confirm both checks passed for the deployed commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          runs_json="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&per_page=100")"
          for workflow_name in CI Security; do
            conclusion="$(jq -r --arg workflow_name "$workflow_name" '[.workflow_runs[] | select(.name == $workflow_name and .status == "completed") | .conclusion] | if any(.[]; . == "failure" or . == "cancelled" or . == "timed_out") then "failure" elif any(.[]; . == "success") then "success" else "pending" end' <<< "$runs_json")"
            test "$conclusion" = success
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy FurimaDeck production
    needs: quality-gate
    if: >-
      always()
      && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (needs.quality-gate.result == 'success' && needs.quality-gate.outputs.ready == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Check out reviewed main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate FurimaDeck deployment settings
        env:
          DEPLOY_HOST: ${{ secrets.FURIMADECK_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.FURIMADECK_DEPLOY_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.FURIMADECK_DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.FURIMADECK_DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.FURIMADECK_DEPLOY_PATH }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_SSH_KNOWN_HOSTS"
          test -n "$DEPLOY_PATH"
          test "$DEPLOY_PATH" != "/"
          test "$DEPLOY_PATH" != "/var/www/furugi"

      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.FURIMADECK_DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.FURIMADECK_DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.FURIMADECK_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.FURIMADECK_DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.FURIMADECK_DEPLOY_PATH }}
          DEPLOY_PORT: ${{ vars.FURIMADECK_DEPLOY_PORT || env.FURIMADECK_DEPLOY_PORT }}
          MIN_PHP_VERSION: ${{ env.MIN_PHP_VERSION }}
        run: |
          printf -v DEPLOY_PATH_ARG '%q' "$DEPLOY_PATH"
          printf -v MIN_PHP_VERSION_ARG '%q' "$MIN_PHP_VERSION"
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- $DEPLOY_PATH_ARG $MIN_PHP_VERSION_ARG" <<'SCRIPT'
          set -euo pipefail

          DEPLOY_PATH="$1"
          MIN_PHP_VERSION="$2"
          case "$DEPLOY_PATH" in
            /|/var/www/furugi)
              echo "Refusing to deploy FurimaDeck to a legacy or unsafe path." >&2
              exit 1
              ;;
          esac

          test -d "$DEPLOY_PATH"
          test -f "$DEPLOY_PATH/.env"
          test ! -e "$DEPLOY_PATH/public/hot"
          cd "$DEPLOY_PATH"
          git status --porcelain
          test -z "$(git status --porcelain)"
          git fetch origin main
          git merge --ff-only origin/main
          php -r "if (version_compare(PHP_VERSION, '$MIN_PHP_VERSION', '<')) { fwrite(STDERR, 'PHP $MIN_PHP_VERSION or newer is required. Current: '.PHP_VERSION.PHP_EOL); exit(1); }"
          COMPOSER_BIN="$(command -v composer)"
          NPM_BIN="$(command -v npm)"
          PHP_BIN="$(command -v php)"
          test -x "$COMPOSER_BIN"
          test -x "$NPM_BIN"
          test -x "$PHP_BIN"
          sudo -u www-data "$COMPOSER_BIN" install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress
          sudo -u www-data "$NPM_BIN" ci --ignore-scripts
          sudo -u www-data "$NPM_BIN" run build
          sudo -u www-data "$PHP_BIN" artisan migrate --database=furimadeck --path=database/migrations/furimadeck --force
          sudo -u www-data "$PHP_BIN" artisan db:seed --database=furimadeck --class=Database\\Seeders\\FurimaDeckCategorySeeder --force
          sudo -u www-data "$PHP_BIN" artisan db:seed --database=furimadeck --class=Database\\Seeders\\FurimaDeckMarketplaceSeeder --force
          sudo -u www-data "$PHP_BIN" artisan furimadeck:check-cutover
          sudo -u www-data "$PHP_BIN" artisan optimize:clear
          sudo -u www-data "$PHP_BIN" artisan config:cache
          sudo -u www-data "$PHP_BIN" artisan route:cache
          sudo -u www-data "$PHP_BIN" artisan view:cache
          sudo -u www-data "$PHP_BIN" artisan queue:restart || true
          sudo systemctl reload apache2
          SCRIPT
