<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=440, initial-scale=1.0" />
  <title>FurimaDeck 出品アシスト — Chrome Web Store promo tile</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 440px; height: 280px; margin: 0; }
    body { overflow: hidden; background: #0b1220; color: #f8fafc; font-family: Arial, "Noto Sans JP", sans-serif; }
    main { position: relative; display: flex; width: 100%; height: 100%; padding: 26px 28px; flex-direction: column; justify-content: space-between; background: radial-gradient(ellipse at 100% 0%, #164e63 0, transparent 46%), linear-gradient(135deg, #0b1220 0%, #142238 100%); }
    header { display: flex; align-items: center; gap: 11px; }
    header img { width: 42px; height: 42px; border-radius: 10px; }
    .brand { color: #a3e635; font-size: 12px; font-weight: 800; letter-spacing: .12em; }
    h1 { margin: 4px 0 0; font-size: 23px; line-height: 1.2; }
    .copy { max-width: 345px; }
    .copy p { margin: 0 0 8px; color: #e2e8f0; font-size: 15px; line-height: 1.55; }
    .pill { display: inline-block; border: 1px solid #84cc16; border-radius: 999px; padding: 6px 11px; color: #ecfccb; background: #1a2e05; font-size: 12px; font-weight: 700; }
    .accent { position: absolute; right: 28px; bottom: 64px; width: 70px; height: 70px; border: 1px solid #22d3ee; border-radius: 18px; background: #0f2940; transform: rotate(-8deg); }
    .accent::before { position: absolute; right: 17px; bottom: 17px; left: 17px; height: 30px; border-bottom: 6px solid #67e8f9; border-left: 6px solid #67e8f9; content: ""; transform: skewY(-34deg); }
    .accent::after { position: absolute; top: 14px; right: 16px; width: 17px; height: 17px; border-top: 6px solid #67e8f9; border-right: 6px solid #67e8f9; content: ""; }
    footer { z-index: 1; color: #cbd5e1; font-size: 11px; }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="../public/icons/icon-128.png" alt="" />
      <div><div class="brand">FURIMADECK</div><h1>出品アシスト</h1></div>
    </header>
    <section class="copy">
      <p>登録済み情報・画像を<br />出品フォームの空欄へ入力補助。</p>
      <span class="pill">確認・出品確定は利用者が操作</span>
    </section>
    <div class="accent" aria-hidden="true"></div>
    <footer>任意権限が必要です。対応欄のみ反映し、フォーム送信はしません。</footer>
  </main>
</body>
</html>
